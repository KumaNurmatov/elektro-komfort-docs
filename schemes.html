:root{--bg:#d9dce1;--panel:#fff;--line:#d6d9de;--acc:#1f6feb;--accbg:#dbe7fd;--accbd:#9ec0f7;--txt:#1d1f23;--mut:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:13px -apple-system,"Segoe UI",Arial,sans-serif;color:var(--txt);background:var(--bg);overflow:hidden}
#app{display:grid;grid-template-columns:46px 200px 1fr 290px;grid-template-rows:44px 1fr 28px;height:100vh}
#top{grid-column:1/5;display:flex;gap:6px;align-items:center;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#top b{font-size:14px;margin-right:8px}
#tb{background:#f4f5f7;border-right:1px solid var(--line);padding:6px 0;overflow:visible;z-index:5}
.tb{position:relative;display:grid;place-items:center;width:36px;height:34px;margin:2px auto;padding:0;border:1px solid transparent;background:none;border-radius:6px}
.tb svg{width:22px;height:22px;overflow:visible}
.tb:hover{background:#e8eaee;border-color:transparent}
.tb.on{background:var(--accbg);border-color:var(--accbd)}
.tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:42px;top:50%;transform:translateY(-50%);background:#1d1f23;color:#fff;padding:4px 8px;border-radius:5px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:60}
.tbsep{height:1px;background:var(--line);margin:6px 8px}
#pal{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:4px 6px 20px}
.pi{display:flex;align-items:center;gap:8px;width:100%;margin:1px 0;padding:4px 6px;border:1px solid transparent;background:none;text-align:left;font-size:12px;border-radius:5px}
.pi:hover{background:#f3f4f6;border-color:transparent}
.pi.on{background:var(--accbg);border-color:var(--accbd)}
.pi svg{width:42px;height:16px;flex:none;overflow:visible}
#wrap{display:grid;grid-template-columns:20px 1fr;grid-template-rows:20px 1fr;min-width:0;min-height:0}
#corner{background:#f7f7f8;border-right:1px solid #c9ccd1;border-bottom:1px solid #c9ccd1}
#rx,#ry{width:100%;height:100%;display:block;background:#f7f7f8}
#view{position:relative;overflow:hidden;outline:none;background:var(--bg)}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#sheet{background:#fff;box-shadow:0 1px 10px rgba(0,0,0,.22);display:block;touch-action:none;overflow:visible}
#view[data-tool=pen] ,#view[data-tool=rect],#view[data-tool=leader],#view[data-tool=dim],#view[data-tool=sym],#view[data-tool=legend],#view[data-tool=cal]{cursor:crosshair}
#view[data-tool=text]{cursor:text}
#view[data-tool=hand],#view.panning{cursor:grab}
#view[data-tool=zoom]{cursor:zoom-in}
#view[data-tool=bg]{cursor:move}
#view[data-tool=select] [data-id],#view[data-tool=direct] [data-id]{cursor:move}
#view.panning *{cursor:grab!important}
#side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#layersBox{flex:0 0 auto;max-height:40%;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
#layersHead{display:flex;align-items:center;gap:6px;padding:8px 12px 4px}
#layersHead h5{margin:0;flex:1}
#layersHead button{padding:2px 7px;font-size:12px}
#layers{overflow:auto;padding:0 6px 6px}
.ly{display:flex;align-items:center;gap:4px;padding:3px 4px;border-radius:5px;cursor:pointer;user-select:none;border:1px solid transparent}
.ly:hover{background:#f3f4f6}
.ly.sel{background:var(--accbg);border-color:#bcd3fb}
.ly.hid .nm{color:#9ca3af;text-decoration:line-through}
.ly.fixed{background:#fafafa}
.ly .ic{width:26px;height:12px;flex:none;overflow:visible}
.ly .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.ly .nm input{padding:1px 4px;font-size:12.5px}
.ly .gr{font-size:10px;color:var(--mut);border:1px solid var(--line);border-radius:3px;padding:0 3px}
.ly .tg{border:0;background:none;padding:0 3px;font-size:13px;line-height:1;opacity:.35;cursor:pointer}
.ly .tg.on{opacity:1}
.ly.drop-a{box-shadow:0 -2px 0 var(--acc)}.ly.drop-b{box-shadow:0 2px 0 var(--acc)}
#props{overflow:auto;padding:4px 12px 20px;flex:1;min-height:0}
#status{grid-column:1/5;display:flex;align-items:center;gap:10px;background:var(--panel);border-top:1px solid var(--line);padding:0 10px;color:var(--mut);font-size:12px;white-space:nowrap}
#hint{flex:1;overflow:hidden;text-overflow:ellipsis}
#coords{min-width:150px;text-align:right;font-variant-numeric:tabular-nums}
#zoomBox{display:flex;align-items:center;gap:3px}
#zoomBox button{padding:1px 7px;font-size:12px}
#zoomIn{width:62px;text-align:center;padding:2px 4px;font-size:12px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 9px;cursor:pointer;color:var(--txt)}
button:hover{border-color:#9aa3af}
button:disabled{opacity:.4;cursor:default}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:#b42318}
h5{margin:14px 0 4px;font-size:11px;text-transform:uppercase;color:var(--mut);letter-spacing:.05em}
#pal h5{margin:10px 6px 4px}
label{display:block;margin:8px 0 2px;font-size:12px;color:#4b5563}
label.chk{display:flex;gap:6px;align-items:center}
label.chk input{width:auto}
input,select,textarea{width:100%;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--txt)}
textarea{min-height:58px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.row4 input{padding:4px 3px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ibtns{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.abtns{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:4px}
.ibtns button,.abtns button{padding:4px 2px;font-size:12px}
.hint{color:var(--mut);font-size:12px;line-height:1.5;margin:6px 0}
.hint kbd,#menu kbd{font:11px -apple-system,Arial;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:#fafafa;color:#374151}
.leg{display:grid;grid-template-columns:1fr 1.3fr 22px;gap:4px;margin:3px 0}
.leg button{padding:0}
.sep{flex:1}
.ui{pointer-events:none}
.ui .h{pointer-events:all}
#menu{position:fixed;display:none;z-index:100;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:4px;min-width:230px}
#menu .mi{display:flex;justify-content:space-between;gap:16px;padding:5px 10px;border-radius:5px;cursor:pointer}
#menu .mi:hover{background:var(--acc);color:#fff}
#menu .mi:hover kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
#menu .mi.dis{opacity:.4;pointer-events:none}
#menu .msep{height:1px;background:var(--line);margin:4px 6px}
@media print{
 #top,#tb,#pal,#side,#status,#corner,#rx,#ry,#menu{display:none!important}
 #app,#wrap{display:block;height:auto}
 html,body{overflow:visible;background:#fff}
 #view{overflow:visible;position:static;background:#fff}
 #stage{position:static;transform:none!important}
 #sheet{box-shadow:none}
 .ui{display:none}
}
</style></head>
<body>
<div id="app">
 <div id="top">
  <b>Редактор схем</b>
  <button id="bNew">Новый</button>
  <button id="bOpen" title="⌘O">Открыть…</button>
  <button id="bSave" title="⌘S">Сохранить</button>
  <span class="sep"></span>
  <button id="bUndo" title="Отменить ⌘Z">↶</button><button id="bRedo" title="Вернуть ⇧⌘Z">↷</button>
  <span class="sep"></span>
  <button id="bPng">PNG</button>
  <button id="bPrint" class="on" title="⌘P">Печать / PDF</button>
  <input type="file" id="fJson" accept=".json,application/json" hidden>
  <input type="file" id="fBg" accept="image/*,.pdf,application/pdf" hidden>
 </div>
 <div id="tb"></div>
 <div id="pal"></div>
 <div id="wrap">
  <div id="corner"></div><canvas id="rx"></canvas><canvas id="ry"></canvas>
  <div id="view" tabindex="0"><div id="stage">
   <svg id="sheet" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="clipDraw"><rect id="clipRect"/></clipPath></defs>
    <g id="bgLayer" clip-path="url(#clipDraw)"></g>
    <g id="objLayer" clip-path="url(#clipDraw)"></g>
    <g id="frameLayer"></g>
    <g id="uiLayer" class="ui"></g>
   </svg>
  </div></div>
 </div>
 <div id="side">
  <div id="layersBox"><div id="layersHead"><h5>Слои</h5><button id="lyShowAll" title="Показать все слои">показать все</button><button id="lyUnlockAll" title="Снять все замки">открыть все</button></div><div id="layers"></div></div>
  <div id="props"></div>
 </div>
 <div id="status"><span id="hint"></span><span id="coords"></span>
  <span id="zoomBox"><button id="bZo" title="Отдалить ⌘−">−</button><input id="zoomIn" title="Масштаб вида"><button id="bZi" title="Приблизить ⌘+">+</button><button id="bFit" title="Весь лист ⌘0">Весь лист</button><button id="b100" title="Натуральный размер ⌘1">1:1</button></span></div>
</div>
<div id="menu"></div>

/* ---------- утилиты ---------- */
const $=id=>document.getElementById(id);
function el(tag,a,p){const e=document.createElementNS(NS,tag);for(const k in a)if(a[k]!==undefined&&a[k]!==null)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function txt(p,x,y,s,size,o={}){const t=el("text",{x,y,"font-size":size,"font-family":"ISO",fill:o.fill||"#000","text-anchor":o.anchor,transform:o.tr},p);t.textContent=s;return t;}
const r2=v=>Math.round(v*100)/100;
const clone=o=>JSON.parse(JSON.stringify(o));
function dist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function W(){return FORMATS[S.fmt][0]} function H(){return FORMATS[S.fmt][1]}
function frame(){return {x0:20,y0:5,x1:W()-5,y1:H()-5};}
function obj(id){return S.objs.find(o=>o.id===id);}

function movable(){return selObjs().filter(o=>!o.locked&&!o.hidden);}

/* ---------- вдоль ломаной ---------- */
function segs(pts,closed){const s=[];for(let i=0;i<pts.length-1;i++)s.push([pts[i],pts[i+1]]);if(closed&&pts.length>2)s.push([pts[pts.length-1],pts[0]]);return s;}
function along(pts,closed,step,start){const out=[];let acc=start;for(const [a,b] of segs(pts,closed)){const L=dist(a,b);if(L<1e-6)continue;const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
 while(acc<=L){const t=acc/L;out.push({x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t,ang});acc+=step;}acc-=L;}return out;}
function pathD(pts,closed){return pts.map((p,i)=>(i?"L":"M")+r2(p[0])+" "+r2(p[1])).join("")+(closed?"Z":"");}
function offsetPts(pts,d){/* простое смещение по нормали с подрезкой углов */
 const out=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[i],c=pts[Math.min(pts.length-1,i+1)];
  let n1=norm(a,b),n2=norm(b,c);if(i===0)n1=n2;if(i===pts.length-1)n2=n1;let nx=n1[0]+n2[0],ny=n1[1]+n2[1];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
  const cos=nx*n2[0]+ny*n2[1]||1;out.push([b[0]+nx*d/Math.max(cos,.3),b[1]+ny*d/Math.max(cos,.3)]);}return out;}
function norm(a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[-dy/l,dx/l];}
function arrowHead(p,tip,from,len,wid,col,open){const a=Math.atan2(tip[1]-from[1],tip[0]-from[0]);const bx=tip[0]-Math.cos(a)*len,by=tip[1]-Math.sin(a)*len;
 const px=-Math.sin(a)*wid,py=Math.cos(a)*wid;
 if(open)el("path",{d:`M${r2(bx+px)} ${r2(by+py)}L${r2(tip[0])} ${r2(tip[1])}L${r2(bx-px)} ${r2(by-py)}`,fill:"none",stroke:col,"stroke-width":.25,"stroke-linejoin":"round"},p);
 else el("path",{d:`M${r2(tip[0])} ${r2(tip[1])}L${r2(bx+px)} ${r2(by+py)}L${r2(bx-px)} ${r2(by-py)}Z`,fill:col,stroke:"none"},p);}

/* ---------- отрисовка линий ---------- */
function drawLine(p,pts,key,closed,col){
 const st=LS[key]||LS.thin,c=col||st.c;if(pts.length<2)return;
 const base={fill:"none",stroke:c,"stroke-width":st.w,"stroke-linejoin":"round","stroke-linecap":st.dash?"butt":"round"};
 if(st.deco==="fstone"){el("path",{...base,d:pathD(offsetPts(pts,.55),closed)},p);el("path",{...base,d:pathD(offsetPts(pts,-.55),closed)},p);
  for(const q of along(pts,closed,6,3)){const nx=-Math.sin(q.ang)*.55,ny=Math.cos(q.ang)*.55;el("line",{x1:r2(q.x+nx),y1:r2(q.y+ny),x2:r2(q.x-nx),y2:r2(q.y-ny),stroke:c,"stroke-width":st.w},p);}return;}
 if(st.deco==="water"){const marks=along(pts,closed,22,11);
  const m=el("mask",{id:"m"+Math.random().toString(36).slice(2),maskUnits:"userSpaceOnUse"},p);el("rect",{x:-9999,y:-9999,width:99999,height:99999,fill:"#fff"},m);
  for(const q of marks)el("circle",{cx:r2(q.x),cy:r2(q.y),r:1.6,fill:"#000"},m);
  el("path",{...base,d:pathD(pts,closed),mask:`url(#${m.id})`},p);
  for(const q of marks)txt(p,r2(q.x),r2(q.y+1),"в",2.8,{anchor:"middle",fill:c});return;}
 el("path",{...base,d:pathD(pts,closed),"stroke-dasharray":st.dash},p);
 if(st.deco==="fsolid")for(const q of along(pts,closed,5,2.5)){const nx=-Math.sin(q.ang)*1.1,ny=Math.cos(q.ang)*1.1;el("line",{x1:r2(q.x),y1:r2(q.y),x2:r2(q.x-nx),y2:r2(q.y-ny),stroke:c,"stroke-width":st.w},p);}
 if(st.deco==="fmesh")for(const q of along(pts,closed,7,3.5)){const s=.55;el("path",{d:`M${r2(q.x-s)} ${r2(q.y-s)}L${r2(q.x+s)} ${r2(q.y+s)}M${r2(q.x+s)} ${r2(q.y-s)}L${r2(q.x-s)} ${r2(q.y+s)}`,stroke:c,"stroke-width":st.w},p);}
 if(st.deco==="N"){for(const q of along(pts,closed,22,11)){el("rect",{x:r2(q.x-1.4),y:r2(q.y-1.7),width:2.8,height:3.4,fill:"#fff"},p);txt(p,r2(q.x),r2(q.y+1.3),"N",3.6,{anchor:"middle",fill:c}).setAttribute("font-weight","bold");}}
 if(st.deco==="vl1"||st.deco==="vl2"){const n=pts.length;
  const ends=[[pts[0],pts[1]],[pts[n-1],pts[n-2]]];if(!closed)for(const [tip,from] of ends){const a=Math.atan2(tip[1]-from[1],tip[0]-from[0]);
   arrowHead(p,tip,from,1.6,.75,c,true);if(st.deco==="vl2"){const t2=[tip[0]-Math.cos(a)*1.1,tip[1]-Math.sin(a)*1.1];arrowHead(p,t2,from,1.6,.75,c,true);}}
  const poles=closed?pts:(n===2?[[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2]]:pts.slice(1,-1));
  for(const q of poles)el("circle",{cx:r2(q[0]),cy:r2(q[1]),r:.7,fill:"#fff",stroke:c,"stroke-width":.25},p);}
}

function drawSym(p,kind,col){

    SEL=[...new Set([...was.base,...ids])];}renderAll();return;}
  if(was.kind==="zrect"){const a=was.a,c=was.cur,wpx=Math.abs(c[0]-a[0])/pxmm(),hpx=Math.abs(c[1]-a[1])/pxmm();

}

 const sc=parseFloat(String(prompt(`Сейчас это примерно 1:${Math.round(raw)}.\nВ каком масштабе делать чертёж? (подложка подгонится)`,S.scale||nice)||"").replace(",","."));if(!sc){drawUI();return;}
 snapshot();S.scale=sc;
 if(S.bg){const k=(m*1000/sc)/L,bg=S.bg,h=bg.w*bg.nh/bg.nw,c=[bg.x+bg.w/2,bg.y+h/2],nc=[a[0]+(c[0]-a[0])*k,a[1]+(c[1]-a[1])*k];

   e=>{if(tool!=="select"&&tool!=="direct"){tool="select";draft=null;$("view").dataset.tool=tool;buildTools();}
    if(e.shiftKey||e.metaKey||e.ctrlKey)SEL=SEL.includes(o.id)?SEL.filter(x=>x!==o.id):[...SEL,o.id];else SEL=[o.id];buildPal();renderAll();},o.g);
  d.draggable=true;d.dataset.i=i;
  d.ondragstart=e=>{lyDrag=i;e.dataTransfer.effectAllowed="move";};
  d.ondragover=e=>{e.preventDefault();const r=d.getBoundingClientRect(),up=e.clientY<r.top+r.height/2;d.classList.toggle("drop-a",up);d.classList.toggle("drop-b",!up);};
  d.ondragleave=()=>d.classList.remove("drop-a","drop-b");
  d.ondrop=e=>{e.preventDefault();const r=d.getBoundingClientRect(),up=e.clientY<r.top+r.height/2;d.classList.remove("drop-a","drop-b");
   if(lyDrag===null||lyDrag===i)return;snapshot();const [m]=S.objs.splice(lyDrag,1);let j=i-(lyDrag<i?1:0);j=up?j+1:j;S.objs.splice(Math.max(0,Math.min(S.objs.length,j)),0,m);lyDrag=null;renderAll();};
  d.ondblclick=e=>{e.stopPropagation();const nm=d.querySelector(".nm");const inpt=document.createElement("input");inpt.value=o.name||autoName(o);nm.textContent="";nm.appendChild(inpt);inpt.focus();inpt.select();
   const done=ok=>{if(ok){const v=inpt.value.trim();snapshot();o.name=v&&v!==autoName(o)?v:"";}inpt.blur();renderAll();};
   inpt.onkeydown=ev=>{ev.stopPropagation();if(ev.key==="Enter")done(true);if(ev.key==="Escape")done(false);};inpt.onblur=()=>{if(inpt.isConnected)done(true);};};}
 if(!S.objs.length){const h=document.createElement("div");h.className="hint";h.style.margin="4px 6px";h.textContent="Пока пусто — всё нарисованное появится здесь.";box.appendChild(h);}
 if(S.bg)row("fixed"+(S.bgHidden?" hid":""),lyIcon("bg"),"Подложка",!S.bgHidden,!!S.bgLocked,()=>{snapshot();S.bgHidden=!S.bgHidden;renderAll();},()=>{snapshot();S.bgLocked=!S.bgLocked;if(S.bgLocked&&tool==="bg")setTool("select");renderAll();},()=>{SEL=[];if(tool!=="bg")setTool("select");else renderAll();});
}
$("lyShowAll").onclick=showAll;
$("lyUnlockAll").onclick=unlockAll;

/* ---------- подложка: загрузка ---------- */
function fitBg(){const b=S.bg,f=frame();if(!b)return;const fw=f.x1-f.x0,fh=f.y1-f.y0-(S.stamp.on?55:0);const k=Math.min(fw/b.nw,fh/b.nh);b.w=b.nw*k;b.x=f.x0+(fw-b.w)/2;b.y=f.y0+(fh-b.nh*k)/2;b.rot=0;}
function setBgFromDataURL(src){const im=new Image();im.onload=()=>{snapshot();S.bg={src,nw:im.naturalWidth,nh:im.naturalHeight,x:0,y:0,w:100,rot:0,op:1};S.bgHidden=false;S.bgLocked=false;fitBg();renderAll();status("Подложка загружена. Чтобы подогнать масштаб — инструмент «Масштаб по двум точкам» (C).");};im.src=src;}
async function loadPdfJs(){if(window.pdfjsLib)return;await new Promise((ok,bad)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=ok;s.onerror=bad;document.head.appendChild(s);});
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";}
$("fBg").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 if(/pdf$/i.test(f.type)||/\.pdf$/i.test(f.name)){status("Открываю PDF…");
  try{await loadPdfJs();const doc=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;let n=1;
   if(doc.numPages>1){n=parseInt(prompt(`В PDF ${doc.numPages} стр. Какую взять?`,"1"))||1;}
   const pg=await doc.getPage(Math.min(Math.max(n,1),doc.numPages));const v0=pg.getViewport({scale:1});const sc=Math.min(4200/Math.max(v0.width,v0.height),6);
   const vp=pg.getViewport({scale:sc}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;const cx=c.getContext("2d");cx.fillStyle="#fff";cx.fillRect(0,0,c.width,c.height);
   await pg.render({canvasContext:cx,viewport:vp}).promise;setBgFromDataURL(c.toDataURL("image/jpeg",.9));}
  catch(err){alert("Не получилось открыть PDF (нужен интернет для первого открытия PDF). Можно загрузить картинку: PNG или JPG.");status("");}
  return;}
 const r=new FileReader();r.onload=()=>setBgFromDataURL(r.result);r.readAsDataURL(f);};

/* ---------- масштаб вида ---------- */
function setZoom(z,cx,cy){const v=$("view").getBoundingClientRect();cx??=v.left+v.width/2;cy??=v.top+v.height/2;
 const lx=cx-v.left,ly=cy-v.top,mx=(lx-panX)/(K*zoom),my=(ly-panY)/(K*zoom);zoom=Math.min(40,Math.max(.1,z));panX=lx-mx*K*zoom;panY=ly-my*K*zoom;applyView();}
function zoomToRect(x0,y0,x1,y1){const v=$("view");zoom=Math.min(40,Math.max(.1,Math.min(v.clientWidth/((x1-x0)*K),v.clientHeight/((y1-y0)*K))*.92));
 panX=v.clientWidth/2-(x0+x1)/2*K*zoom;panY=v.clientHeight/2-(y0+y1)/2*K*zoom;applyView();}
function fit(){const v=$("view");zoom=Math.max(.1,Math.min((v.clientWidth-60)/(W()*K),(v.clientHeight-60)/(H()*K)));panX=(v.clientWidth-W()*K*zoom)/2;panY=(v.clientHeight-H()*K*zoom)/2;renderAll();}
function zoomSel(){const b=unionBB(selObjs());if(b)zoomToRect(b.x0-5,b.y0-5,b.x1+5,b.y1+5);}

/* ---------- печать, PNG, файлы ---------- */
function doPrint(){SEL=[];draft=null;renderAll();let ps=$("pageStyle");if(!ps){ps=document.createElement("style");ps.id="pageStyle";document.head.appendChild(ps);}
 ps.textContent=`@page{size:${W()}mm ${H()}mm;margin:0} @media print{#sheet{width:${W()}mm!important;height:${H()}mm!important}}`;
 document.fonts.ready.then(()=>window.print());}
function exportPng(){SEL=[];renderAll();const sv=$("sheet").cloneNode(true);sv.querySelector("#uiLayer").remove();const dpi=200,pw=Math.round(W()/25.4*dpi),ph=Math.round(H()/25.4*dpi);
 sv.setAttribute("width",pw);sv.setAttribute("height",ph);sv.removeAttribute("style");const st=document.createElementNS(NS,"style");st.textContent=`@font-face{font-family:ISO;src:url(data:font/woff2;base64,${FONT_B64}) format("woff2")}`;sv.insertBefore(st,sv.firstChild);
 const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(sv)],{type:"image/svg+xml"}));const im=new Image();
 im.onload=()=>{const c=document.createElement("canvas");c.width=pw;c.height=ph;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,pw,ph);x.drawImage(im,0,0);URL.revokeObjectURL(url);
  c.toBlob(b=>dl(b,fileBase()+".png"),"image/png");};im.src=url;}
function fileBase(){return (S.stamp.title||"схема").split("\n")[0].replace(/[\\/:*?"<>|…]/g,"").trim().slice(0,60)||"схема";}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
$("bSave").onclick=()=>dl(new Blob([JSON.stringify(S)],{type:"application/json"}),fileBase()+".json");
$("bOpen").onclick=()=>$("fJson").click();
$("fJson").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);snapshot();S={...fresh(),...d,stamp:{...DEF_STAMP,...d.stamp}};SEL=[];fit();}catch(_){alert("Это не файл схемы.");}};r.readAsText(f);};
$("bNew").onclick=()=>{if(!confirm("Начать новую схему? Текущая останется в «Отменить».")) return;snapshot();S=fresh();SEL=[];fit();};
$("bUndo").onclick=()=>{if(!U.length)return;R.push(JSON.stringify(S));restore(U.pop());};
$("bRedo").onclick=()=>{if(!R.length)return;U.push(JSON.stringify(S));restore(R.pop());};
$("bZi").onclick=()=>setZoom(zoom*1.25);$("bZo").onclick=()=>setZoom(zoom/1.25);$("bFit").onclick=fit;$("b100").onclick=()=>setZoom(1);
$("zoomIn").onchange=()=>{const v=parseFloat($("zoomIn").value);if(v>0)setZoom(v/100);$("zoomIn").blur();};
$("zoomIn").onfocus=()=>$("zoomIn").select();
$("bPrint").onclick=doPrint;$("bPng").onclick=exportPng;

/* ---------- события ---------- */
const view=$("view");
view.addEventListener("pointerdown",onDown);window.addEventListener("pointermove",onMove);window.addEventListener("pointerup",onUp);
view.addEventListener("dblclick",onDbl);
view.addEventListener("contextmenu",e=>{e.preventDefault();if(draft&&draft.kind==="line"){finishLine();return;}
 if(tool!=="select"&&tool!=="direct")setTool("select");
 const g=e.target.closest("[data-id]");if(g){const ids=grp(+g.dataset.id);if(!ids.every(i=>SEL.includes(i))){SEL=ids;renderAll();}}
 showMenu(e.clientX,e.clientY);});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#menu"))hideMenu();},true);
view.addEventListener("wheel",e=>{e.preventDefault();
 if(e.ctrlKey||e.metaKey||e.altKey){setZoom(zoom*Math.exp(-e.deltaY*(e.ctrlKey&&!e.metaKey?.01:.0025)),e.clientX,e.clientY);return;}
 let dx=e.deltaX,dy=e.deltaY;if(e.shiftKey&&!dx){dx=dy;dy=0;}panX-=dx;panY-=dy;applyView();},{passive:false});
view.addEventListener("pointerleave",()=>{mouse=null;drawRulers();});
window.addEventListener("keydown",e=>{
 const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName),mod=e.ctrlKey||e.metaKey,c=e.code;
 if(mod&&c==="KeyZ"&&!inField){e.preventDefault();(e.shiftKey?$("bRedo"):$("bUndo")).click();return;}
 if(mod&&c==="KeyY"&&!inField){e.preventDefault();$("bRedo").click();return;}
 if(mod&&c==="KeyP"){e.preventDefault();doPrint();return;}
 if(mod&&c==="KeyS"){e.preventDefault();$("bSave").click();return;}
 if(mod&&c==="KeyO"){e.preventDefault();$("bOpen").click();return;}
 if(inField){if(e.key==="Escape")document.activeElement.blur();return;}
 if(mod){const act={KeyA:selectAll,KeyC:copySel,KeyX:cutSel,KeyV:()=>paste(e.shiftKey),KeyD:dupSel,KeyG:()=>e.shiftKey?ungroupSel():groupSel(),
   BracketRight:()=>arrange(e.shiftKey?"front":"fwd"),BracketLeft:()=>arrange(e.shiftKey?"back":"bwd"),
   Equal:()=>setZoom(zoom*1.25),NumpadAdd:()=>setZoom(zoom*1.25),Minus:()=>setZoom(zoom/1.25),NumpadSubtract:()=>setZoom(zoom/1.25),
   Digit0:()=>e.altKey?zoomSel():fit(),Digit1:()=>setZoom(1),Digit2:()=>e.altKey?unlockAll():lockSel(false),Digit3:()=>e.altKey?showAll():hideSel()}[c];
  if(act){e.preventDefault();act();}return;}
 if(c==="Space"){if(!spaceDown){spaceDown=true;view.classList.add("panning");}e.preventDefault();return;}
 if(e.key==="Enter"){finishLine();return;}
 if(e.key==="Escape"){hideMenu();if(draft){draft=null;snapPt=null;drawUI();}else if(tool!=="select")setTool("select");else{SEL=[];renderAll();}return;}
 if(e.key==="Backspace"&&draft&&draft.kind==="line"){draft.pts.pop();if(!draft.pts.length)draft=null;drawUI();e.preventDefault();return;}
 if((e.key==="Delete"||e.key==="Backspace")&&SEL.length){e.preventDefault();delSel();return;}
 if(SEL.length&&e.key.startsWith("Arrow")){const l=movable();if(!l.length)return;e.preventDefault();snapshot();const s=e.shiftKey?5:.5;
  const dx=e.key==="ArrowLeft"?-s:e.key==="ArrowRight"?s:0,dy=e.key==="ArrowUp"?-s:e.key==="ArrowDown"?s:0;l.forEach(o=>moveObj(o,dx,dy));renderAll();return;}
 if(KEYS[c]&&!e.altKey){setTool(KEYS[c]);}
});
window.addEventListener("keyup",e=>{if(e.code==="Space"){spaceDown=false;if(!drag)view.classList.remove("panning");}});
